name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['24.7.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, build and run the unit suite
        run: |
          npm run typecheck
          npm run build
          npm run test:unit
      - name: Start the runner's PostgreSQL service
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql*
          Set-Service -InputObject $service -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready.exe" --timeout=60
          & "$env:PGBIN\psql.exe" -At -c 'SELECT version()'
      - name: Run the integration suite against it
        env:
          TEST_DATABASE_URL: postgresql://postgres:root@localhost:5432/postgres
        run: npm run test:integration
