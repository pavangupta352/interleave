name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }} / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.7.0']
        postgres: ['16', '17', '18']
    env:
      INTERLEAVE_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, test real PostgreSQL and build the package
        run: npm run check
      - name: Inspect the publishable package
        run: npm pack --dry-run

  pgvector:
    name: PostgreSQL 17 + pgvector 0.8.6 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.7.0']
    env:
      INTERLEAVE_TEST_POSTGRES_IMAGE: pgvector/pgvector:0.8.6-pg17-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Qualify the explicit pgvector fixture and application profile
        run: npm run test:integration -- pgvector

  browser:
    name: Offline report / Chromium, Firefox and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.7.0'
          cache: npm
      - name: Install locked dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Check desktop and mobile reports using a real PostgreSQL run
        run: npm run test:browser
