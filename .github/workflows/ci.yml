name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }} / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.7.0']
        postgres: ['16', '17', '18']
    env:
      INTERLEAVE_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, test real PostgreSQL and build the package
        run: npm run check
      - name: Inspect the publishable package
        run: npm pack --dry-run

  pgvector:
    name: PostgreSQL 17 + pgvector 0.8.6 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.7.0']
    env:
      INTERLEAVE_TEST_POSTGRES_IMAGE: pgvector/pgvector:0.8.6-pg17-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Qualify the explicit pgvector fixture and application profile
        run: npm run test:integration -- pgvector

  managed:
    name: Managed local PostgreSQL CLI / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.7.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Qualify managed setup, replay, reduction and interruption against real Docker
        run: npm run test:managed

  browser:
    name: Offline report / Chromium, Firefox and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.7.0'
          cache: npm
      - name: Install locked dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Check desktop and mobile reports using a real PostgreSQL run
        run: npm run test:browser

  release-candidate:
    name: Prepare release assets (no publication)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [postgres, pgvector, managed, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.7.0'
      - name: Verify the canonical packaging toolchain
        run: test "$(npm --version)" = 11.5.1
      - name: Build twice, inspect original archives and smoke-test the exact package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          INTERLEAVE_RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/prepare-release.mjs --tag "$RELEASE_TAG" --out release-candidate
      - name: Upload prepared archives, checksums and manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-candidate-${{ github.ref_name }}
          path: release-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false
          overwrite: false
